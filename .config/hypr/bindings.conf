# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
$terminal = uwsm-app -- xdg-terminal-exec
#$browser = omarchy-launch-browser
$browser = zen-browser

bindd = SUPER, RETURN, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER, E, File manager, exec, thunar
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus signal "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus "^obsidian$" "uwsm-app -- obsidian"
# bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
#bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
#bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
#bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT, C, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
# bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
#bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
#bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
$mainMod = SUPER
bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu
bindd = SUPER, Q, Close active window, killactive,
bindd = SUPER, D, Launch apps, exec, omarchy-launch-walker
bindd = SUPER, P, Browser, exec, $browser

$monitor1=eDP-1
$monitor2=HDMI-A-1

workspace = 1,monitor:$monitor1, default:true
workspace = 2, monitor:$monitor1

workspace = 3, monitor:$monitor1
workspace = 4, monitor:$monitor1
workspace = 5, monitor:$monitor2, default:true
workspace = 6, monitor:$monitor2
workspace = 7, monitor:$monitor2
workspace = 8, monitor:$monitor2
workspace = 9, monitor:$monitor2
workspace = 10, monitor:$monitor2

#Music Controls
bind= $mainMod ALT, down, exec,  mpc toggle
bind= $mainMod ALT, right, exec, mpc next
bind= $mainMod ALT, left, exec, mpc prev

bind= $mainMod ALT CTRL, down, exec, playerctl play-pause
bind= $mainMod ALT CTRL, right, exec, playerctl next
bind= $mainMod ALT CTRL, left, exec, playerctl previous
bind= $mainMod SHIFT, H, exec, $scriptsDir/VimMotions.sh
bind= $mainMod SHIFT, V, exec, pavucontrol
bind= $mainMod SHIFT, B, exec, blueman-manager
bind= $mainMod, M, exec, ghostty -e rmpc
bind= $mainMod, V, exec, code
bind= $mainMod, Z, exec,  uwsm-app -- /home/anu/.local/bin/zed
bind= $mainMod, C, exec, copyq toggle

bind=CTRL, XF86AudioPlay, exec, playerctl play-pause
bind=CTRL, XF86AudioPause, exec, playerctl play-pause
bind=CTRL, XF86AudioNext, exec, playerctl next
bind=CTRL, XF86AudioPrev, exec, playerctl previous
bind= , XF86AudioPlay, exec,mpc toggle
bind= , XF86AudioPause, exec,  mpc pause
bind= , XF86AudioNext, exec, mpc next
bind= , XF86AudioPrev, exec, mpc prev
bind= , XF86AudioStop, exec, mpc stop

# Switch workspaces with SUPER + [0-9]
bindd = SUPER, code:10, Switch to workspace 1, workspace, 1
bindd = SUPER, code:11, Switch to workspace 2, workspace, 2
bindd = SUPER, code:12, Switch to workspace 3, workspace, 3
bindd = SUPER, code:13, Switch to workspace 4, workspace, 4
bindd = SUPER, code:14, Switch to workspace 5, workspace, 5
bindd = SUPER, code:15, Switch to workspace 6, workspace, 6
bindd = SUPER, code:16, Switch to workspace 7, workspace, 7
bindd = SUPER, code:17, Switch to workspace 8, workspace, 8
bindd = SUPER, code:18, Switch to workspace 9, workspace, 9
bindd = SUPER, code:19, Switch to workspace 10, workspace, 10

# Move active window to a workspace with SUPER + SHIFT + [0-9]
bindd = ALT, code:10, Move window to workspace 1, movetoworkspace, 1
bindd = ALT, code:11, Move window to workspace 2, movetoworkspace, 2
bindd = ALT, code:12, Move window to workspace 3, movetoworkspace, 3
bindd = ALT, code:13, Move window to workspace 4, movetoworkspace, 4
bindd = ALT, code:14, Move window to workspace 5, movetoworkspace, 5
bindd = ALT, code:15, Move window to workspace 6, movetoworkspace, 6
bindd = ALT, code:16, Move window to workspace 7, movetoworkspace, 7
bindd = ALT, code:17, Move window to workspace 8, movetoworkspace, 8
bindd = ALT, code:18, Move window to workspace 9, movetoworkspace, 9
bindd = ALT, code:19, Move window to workspace 10, movetoworkspace, 10

bindd = SUPER, X, System menu, exec, omarchy-menu system
